# Dependabot configuration for Edge Telemetry Gateway
# Ref: Workspace AGENTS.md §9 / Capa 2 §5
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps):"
