# pre-commit configuration for Edge Telemetry Gateway
# Run: pre-commit install && pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]
        args: [--style=file, --fallback-style=Google]
        exclude: '^(shared_components/nanopb/|shared_components/proto/.*\.pb\.)'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=500]
