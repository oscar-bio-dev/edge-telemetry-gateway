syntax = "proto3";

package telemetry;

// El "Mega-Esquema" canónico (Single Source of Truth)
// Alineado con: edge-telemetry-gateway/shared_components/proto/telemetry.proto
message TelemetryPayload {
    // Versioning
    uint32 protocol_version = 1;
    uint32 schema_version = 2;

    // Identidad e Idempotencia
    string event_id = 3;          // UUID para idempotencia (inyectado por el gateway)
    string gateway_id = 4;        // MAC del gateway (inyectado por el gateway)
    string device_id = 5;         // MAC del nodo sensor
    uint32 node_sequence = 6;     // Secuencia originada por el nodo

    // Tiempos
    uint64 measured_at_ms = 7;    // Timestamp en el nodo (o en el gateway si el nodo no tiene RTC)
    uint64 ingested_at_ms = 8;    // Timestamp al momento de ingestión en el gateway

    // Ambiental y Calidad de Aire (BME688 / SCD41)
    optional float temperature = 9;      // Celsius
    optional float humidity = 10;        // % RH
    optional float pressure = 11;        // hPa
    optional float gas_resistance = 12;  // Ohms (VOCs)
    optional float iaq = 13;             // Index of Air Quality
    optional uint32 co2 = 14;            // ppm

    // Partículas (BMV080)
    optional float pm1_0 = 15;           // ug/m3
    optional float pm2_5 = 16;           // ug/m3
    optional float pm10_0 = 17;          // ug/m3

    // Agua y Suelo
    optional float ph = 18;              // 0.0 - 14.0
    optional float dissolved_oxygen = 19;// mg/L

    // Diagnósticos del Nodo
    optional uint32 battery_mv = 20;     // Millivolts
    optional uint32 sleep_cycles = 21;   // Hardware wake count
}
